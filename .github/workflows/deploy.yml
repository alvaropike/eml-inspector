# Publica la web en el hosting de Hostinger (eml.alvaropiquerastrenado.com) por FTP en cada push a main.
#
# Secrets del repositorio (Settings › Secrets and variables › Actions):
#   GOOGLE_SAFE_BROWSER  clave de la Safe Browsing API; va a api/sb-key.php, que no se puede descargar
#   FTP_SERVER           IP de FTP de hPanel (Archivos › Cuentas FTP); el dominio pasa por Cloudflare y
#                        ftp.<dominio> no llega al hosting
#   FTP_USERNAME         usuario de una cuenta FTP cuyo directorio sea la carpeta del subdominio
#   FTP_PASSWORD         contraseña de esa cuenta
# Variable opcional FTP_SERVER_DIR: carpeta de destino dentro de la cuenta FTP (por defecto, su raíz).

name: Desplegar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configuración del sitio
        env:
          SB_KEY: ${{ secrets.GOOGLE_SAFE_BROWSER }}
        run: |
          printf "window.EML_CONFIG = {\n  safeBrowsingKey: '',\n  safeBrowsingProxy: 'api/safebrowsing.php',\n};\n" > config.js
          if [ -z "$SB_KEY" ]; then
            echo "::warning::Falta el secret GOOGLE_SAFE_BROWSER: Safe Browsing no funcionará en la web."
          elif ! printf '%s' "$SB_KEY" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::GOOGLE_SAFE_BROWSER no parece una clave de API de Google."; exit 1
          else
            printf "<?php return '%s';\n" "$SB_KEY" > api/sb-key.php
          fi

      # Avisa de errores típicos en los secrets sin mostrar su valor.
      - name: Comprobar datos FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          check() { # nombre valor
            if [ -z "$2" ]; then echo "::error::$1 está vacío."; return; fi
            if [ "$2" != "$(printf '%s' "$2" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]; then echo "::warning::$1 tiene espacios o saltos de línea al principio o al final."; fi
          }
          check FTP_SERVER "$FTP_SERVER"; check FTP_USERNAME "$FTP_USERNAME"; check FTP_PASSWORD "$FTP_PASSWORD"
          printf '%s' "$FTP_SERVER" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' || echo "::warning::FTP_SERVER no es una IP."
          printf '%s' "$FTP_USERNAME" | grep -Eq '^u[0-9]+(\.[A-Za-z0-9_.-]+)?$' || echo "::warning::FTP_USERNAME no tiene el formato de Hostinger (u123456789 o u123456789.nombre)."

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # El certificado FTPS de Hostinger no es del nombre ni de la IP a la que se conecta:
          # se cifra igualmente, pero sin validar el certificado.
          security: loose
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            iniciar.bat
            config.example.js
            worker/**
